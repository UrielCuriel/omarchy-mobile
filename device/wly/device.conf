# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 10 Pro (wly, NE2215). Format rules:
# device/cheetah/device.conf. Notes: NOTES.md.
#
# RAM-only bring-up. Header-v2 `fastboot boot` is unreliable on this ABL
# (NOTES.md), while header v4 boots every time but takes the DTB from the
# flashed vendor_boot. So this phone uses dodge's two-stage chain:
# `omamobile images` packs a kernel-only header-v4 stage 1 that kexecs
# stage 2 (our Image, our DTB with the live memory map, the shared
# initramfs). Nothing is written to the phone.
#
# Slots: stock OxygenOS runs on slot B; slot A is marked unbootable by the
# last OTA. An install would therefore use slot A, which the tooling's
# slot-B-only UFS_RW rules do not allow yet: no install path exists for
# this phone. UFS_RW below only satisfies those rules, and the board DTS
# does not enable the UFS host at all, so stage 2 sees no storage.
#
# FASTBOOT_PRODUCT=taro is ABL's `getvar product`, the SoC's name.
# Never flash xbl/abl/vbmeta/modem/persist from an image.

CODENAME=wly
FASTBOOT_PRODUCT=taro
NAME="OnePlus 10 Pro"
SOC=sm8450
COMPATIBLE="oneplus,wly"
PACKAGE=omamobile-device-wly
BOOT_METHOD=qcom-abl

DTB=qcom/sm8450-oneplus-wly.dtb
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2412

BOOT_IMAGES=boot
UFS_RW="boot_b userdata"
OMAMOBILE_SLOT=b
# The init's USB self-recovery panics so ABL falls back to the other slot.
# Here slot A is unbootable, so that panic leaves no bootable slot and ABL
# loops on its logo until `fastboot set_active b`. Stay up instead.
INITRAMFS_USB_RECOVERY=no
# Stage 2's command line (omamobile images prepends rdinit=/init and appends
# omamobile.ufs-probe, a no-op here: the DTS enables no UFS host).
# - arm-smmu.disable_bypass=0: after kexec the apps SMMU inherits no boot
#   mappings, and with bypass disabled it blocks the splash scan-out (the
#   screen went dark as the SMMU probed); unmatched streams now pass.
# - fbcon=font:TER16x32: a console readable on a 1080-wide panel.
# - panic=60: a minute to read a panic before ABL takes over again.
# - omamobile.initramfs: stay in the initramfs; RAM-only, nothing mounted rw.
CMDLINE="clk_ignore_unused pd_ignore_unused console=tty0 fbcon=font:TER16x32 panic=60 arm-smmu.disable_bypass=0 omamobile.initramfs"
# Stage 2 DTB options (device/wly/chainload/stage2-dtb.py). Keep the dwc3
# node's iommus: without them its first DMA reset the whole SoC.
DTB_OPTS=rscpd
